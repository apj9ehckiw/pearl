name: PearlWallet
options:
  bundleIdPrefix: app.pearlwallet
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.5.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  PearlWallet:
    type: application
    platform: iOS
    info:
      path: Resources/Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers:
          - app.pearlwallet.ios.refresh
        UIBackgroundModes:
          - fetch
    sources: [Sources, Resources]
    dependencies:
      - framework: Frameworks/PearlCore.xcframework
        embed: false
      - sdk: libc++.tbd
      - sdk: libresolv.tbd
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pearlwallet.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pearl 钱包
        INFOPLIST_KEY_NSFaceIDUsageDescription: 使用面容 ID 解锁本机 Pearl 钱包和验证转账。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PearlWalletTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: PearlWallet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PearlWallet:
    build:
      targets:
        PearlWallet: all
    test:
      targets: [PearlWalletTests]
